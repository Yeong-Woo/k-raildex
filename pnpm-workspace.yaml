packages:
  - apps/*
  - packages/*

# 설치 스크립트 실행을 허용하는 의존성(pnpm 은 기본 차단)
allowBuilds:
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  simple-git-hooks: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@testcontainers/postgresql@12.2.2'
  - testcontainers@12.2.2
  - '@tanstack/query-core@5.108.2'
  - '@tanstack/react-query@5.108.2'
  - lucide-react@1.77.0
  - tailwind-merge@3.7.1
