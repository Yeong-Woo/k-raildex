# 로컬 개발 인프라 (docs/02-architecture.md 5절). 127.0.0.1 에만 묶는다.
# 문서 저장소는 S3 호환 SeaweedFS(MinIO 공식 이미지를 받을 수 없어 대체, docs/decisions.md 구현 판단).
name: k-raildex-dev

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: raildex
      POSTGRES_USER: raildex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raildex-dev}
    ports:
      - '127.0.0.1:${DB_PORT:-5440}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raildex -d raildex']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.54
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # 키 값은 저장소 루트 .env 에서 읽는다(pnpm stack:* 스크립트가 --env-file .env 를 넘김). 지도 키는 관리 앱 빌드 때 들어간다.
  # ---- 앱(프로필 app): pnpm stack:up — api·worker·관리 앱·공개 사이트를 컨테이너로 -----------------------------
  # 개발용: 인증은 AUTH_DEV_BYPASS(NODE_ENV=development 에서만 동작). 운영 구성은 compose.prod.yml(전환 A).
  migrate:
    profiles: [app]
    build: { context: .., dockerfile: docker/app.Dockerfile }
    image: k-raildex-app:dev
    # 실행 시에는 pnpm 없이(네트워크·캐시 불필요) tsx 로 마이그레이션 CLI 를 바로 부른다
    command: ['packages/db/node_modules/.bin/tsx', 'packages/db/src/cli.ts', 'migrate']
    environment: &app-env
      DATABASE_URL: postgres://raildex:${POSTGRES_PASSWORD:-raildex-dev}@db:5432/${APP_DB:-raildex}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: raildex-docs
      S3_ACCESS_KEY: raildex-dev
      S3_SECRET_KEY: raildex-dev-secret
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      DATA_GO_KR_KEY_TAGO_SUBWAY: ${DATA_GO_KR_KEY_TAGO_SUBWAY:-}
      DATA_GO_KR_KEY_TAGO_TRAIN: ${DATA_GO_KR_KEY_TAGO_TRAIN:-}
      DATA_GO_KR_KEY_KORAIL: ${DATA_GO_KR_KEY_KORAIL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      KRIC_KEY: ${KRIC_KEY:-}
      SEOUL_OPEN_KEY: ${SEOUL_OPEN_KEY:-}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    image: k-raildex-app:dev
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *app-env
      NODE_ENV: development
      AUTH_DEV_BYPASS: '1'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dev@localhost}
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:${API_PORT:-5101}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    profiles: [app]
    image: k-raildex-app:dev
    command: ['node', 'apps/worker/dist/main.js']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    restart: unless-stopped

  admin:
    profiles: [app]
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_VWORLD_API_KEY: ${VITE_VWORLD_API_KEY:-${VWORLD_API_KEY:-}}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}
        VITE_THUNDERFOREST_API_KEY: ${VITE_THUNDERFOREST_API_KEY:-${THUNDERFOREST_API_KEY:-}}
    image: k-raildex-admin:dev
    ports:
      - '127.0.0.1:${ADMIN_PORT:-5202}:80'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # 공개 사이트(Next.js SSR, docs/06-public-web.md). 브라우저 → web → api(공개 API, 컨테이너 안 주소)
  # 컨테이너 안 포트 5000 = Cloudflare 터널 공개 호스트 이름(k-raildex.com → http://web:5000, 대시보드 설정)과 맞춘 값
  web:
    profiles: [app]
    build: { context: .., dockerfile: docker/web.Dockerfile }
    image: k-raildex-web:dev
    environment:
      PUBLIC_API_URL: http://api:3000
      WEB_API_TOKEN: ${WEB_API_TOKEN:-}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:5203}
      PUBLIC_ISSUES_URL: ${PUBLIC_ISSUES_URL:-}
      # 미래 지도 배경(VWorld, 도메인 묶인 브라우저 공개 키 — 서버가 읽어 타일 주소로 넘긴다). 없으면 OSM 타일
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      # OSM 교통 지도(Thunderforest Transport) 타일 키 — 배경 기본값. 없으면 OSM 표준
      THUNDERFOREST_API_KEY: ${THUNDERFOREST_API_KEY:-}
      PORT: '5000'
    ports:
      - '127.0.0.1:${WEB_PORT:-5203}:5000'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 외부 공개(2026-11-25 기존 시스템 교체): Cloudflare 터널 → 공개 사이트(web)만. 관리 앱·API·DB 는 터널에 넣지 않는다(C-9).
  # 토큰은 .env 의 CLOUDFLARE_TUNNEL_TOKEN(원격 관리 터널, 공개 호스트 이름은 Cloudflare 대시보드). 토큰이 있으면 pnpm stack:up 이 프로필 tunnel 을 켠다
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  db-data:
  s3-data:
