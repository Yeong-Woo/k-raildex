# 로컬 개발 인프라 (docs/02-architecture.md 5절). 127.0.0.1 에만 묶는다.
# 문서 저장소는 S3 호환 SeaweedFS(MinIO 공식 이미지를 받을 수 없어 대체, docs/decisions.md 구현 판단).
name: k-raildex-dev

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: raildex
      POSTGRES_USER: raildex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raildex-dev}
    ports:
      - '127.0.0.1:${DB_PORT:-5440}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raildex -d raildex']
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.54
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

  # ---- 앱(프로필 app): pnpm stack:up — api·worker·관리 앱을 컨테이너로 -----------------------------
  # 개발용: 인증은 AUTH_DEV_BYPASS(NODE_ENV=development 에서만 동작). 운영 구성은 compose.prod.yml(전환 A).
  migrate:
    profiles: [app]
    build: { context: .., dockerfile: docker/app.Dockerfile }
    image: k-raildex-app:dev
    # 실행 시에는 pnpm 없이(네트워크·캐시 불필요) tsx 로 마이그레이션 CLI 를 바로 부른다
    command: ['packages/db/node_modules/.bin/tsx', 'packages/db/src/cli.ts', 'migrate']
    environment: &app-env
      DATABASE_URL: postgres://raildex:${POSTGRES_PASSWORD:-raildex-dev}@db:5432/${APP_DB:-raildex}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: raildex-docs
      S3_ACCESS_KEY: raildex-dev
      S3_SECRET_KEY: raildex-dev-secret
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      KRIC_KEY: ${KRIC_KEY:-}
      SEOUL_OPEN_KEY: ${SEOUL_OPEN_KEY:-}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    image: k-raildex-app:dev
    command: ['node', 'apps/api/dist/main.js']
    environment:
      <<: *app-env
      NODE_ENV: development
      AUTH_DEV_BYPASS: '1'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dev@localhost}
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:${API_PORT:-5101}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles: [app]
    image: k-raildex-app:dev
    command: ['node', 'apps/worker/dist/main.js']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }

  admin:
    profiles: [app]
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_VWORLD_API_KEY: ${VITE_VWORLD_API_KEY:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: k-raildex-admin:dev
    ports:
      - '127.0.0.1:${ADMIN_PORT:-5202}:80'
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
  s3-data:
