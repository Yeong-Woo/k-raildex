# 관리 앱 정적 파일 + API 프록시. 운영에서는 앞단(Cloudflare Access)이 인증을 맡고,
# Access 가 붙인 Cf-Access-Jwt-Assertion 헤더를 그대로 API 로 넘긴다(API 가 검증).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 200m;

  # 기본 mime.types 에 .mjs 가 없어 MapLibre 작업 스크립트(모듈 워커)가 거부된다
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  # api 컨테이너가 다시 만들어지면 주소가 바뀌므로 시작 때 한 번만 해석하지 않고 Docker DNS 로 다시 해석한다
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /v1/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
  location = /health {
    proxy_pass $api_upstream;
  }
  # nginx 는 location 에 add_header 가 있으면 server 의 것을 물려받지 않으므로 보안 헤더를 반복한다
  # SPA: 알 수 없는 경로는 index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
}
